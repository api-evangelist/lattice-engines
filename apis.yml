aid: lattice-engines
name: Lattice Engines
description: >-
  Lattice Engines was a predictive marketing and AI-driven B2B customer data
  platform that applied machine learning to first-party CRM and marketing
  automation data combined with external firmographic, technographic, and intent
  signals in order to score accounts and leads, prioritize sales outreach, and
  power account-based marketing programs. The company was acquired by Dun &
  Bradstreet in 2019 and the product was rebranded D&B Lattice before being
  folded into the Dun & Bradstreet Rev.Up ABX go-to-market platform. Lattice
  Engines no longer operates as an independent brand and publishes no developer
  surface of its own: as of the 2026-07-19 enrichment probe, www.lattice-engines.com
  returns HTTP 301 to dnb.com, the apex domain returns HTTP 403, api.lattice-engines.com
  returns HTTP 404, and developer./docs. subdomains do not resolve. This profile is
  retained as a historical record; the live successor surface is documented in the
  api-evangelist dun-and-bradstreet repository.
